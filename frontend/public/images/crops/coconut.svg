<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgCoconut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="cocoHusk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgCoconut)" rx="16"/>
  <!-- Palm Fronds -->
  <path d="M200 80 Q100 40 40 100 Q110 70 200 90 Z" fill="#16a34a" opacity="0.6"/>
  <path d="M200 80 Q300 40 360 100 Q290 70 200 90 Z" fill="#15803d" opacity="0.6"/>
  <!-- Coconuts -->
  <circle cx="170" cy="160" r="45" fill="url(#cocoHusk)" filter="drop-shadow(2px 6px 8px rgba(0,0,0,0.2))"/>
  <circle cx="230" cy="170" r="42" fill="url(#cocoHusk)" filter="drop-shadow(2px 6px 8px rgba(0,0,0,0.2))"/>
  <circle cx="200" cy="135" r="38" fill="url(#cocoHusk)" filter="drop-shadow(2px 6px 8px rgba(0,0,0,0.2))"/>
  <!-- Label Badge -->
  <rect x="20" y="246" width="160" height="34" rx="8" fill="rgba(255,255,255,0.9)" stroke="#a5f3fc"/>
  <text x="32" y="268" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0e7490">🥥 Coconut (ತೆಂಗು)</text>
</svg>