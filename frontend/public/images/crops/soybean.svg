<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgSoy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="podGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
    <linearGradient id="beanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="14" fill="url(#bgSoy)"/>
  <!-- Soybean Botanical Leaves & Pod -->
  <g transform="translate(14, 10)">
    <!-- Leaves -->
    <path d="M36 28 C20 16 12 32 30 40 C34 42 36 36 36 28 Z" fill="#65a30d" opacity="0.9"/>
    <path d="M36 28 C52 16 60 32 42 40 C38 42 36 36 36 28 Z" fill="#4d7c0f" opacity="0.9"/>
    <!-- Stem -->
    <path d="M36 24 L36 78" stroke="#3f6212" stroke-width="3" stroke-linecap="round"/>
    <!-- Soybean Pod Outer -->
    <path d="M36 38 C56 46 54 70 34 76 C24 74 26 56 36 38 Z" fill="url(#podGrad)"/>
    <!-- Pod Beaded Beans Impression -->
    <ellipse cx="37" cy="48" rx="5" ry="6" fill="url(#beanGrad)"/>
    <ellipse cx="39" cy="58" rx="5.5" ry="6.5" fill="url(#beanGrad)"/>
    <ellipse cx="36" cy="68" rx="5" ry="5.5" fill="url(#beanGrad)"/>
    <!-- Pod Seam Line -->
    <path d="M35 40 Q43 56 33 74" stroke="#365314" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
